[package]
name = "telenotes-tui"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
telenotes-core = { path = "../telenotes-core" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "5"
pulldown-cmark = { version = "0.13.4", default-features = false }
tl = "0.7.8"

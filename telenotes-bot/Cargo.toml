[package]
name = "telenotes-bot"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
telenotes-core = { path = "../telenotes-core" }
teloxide = { version = "0.17", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
base64 = "0.22"
# Postgres TLS uses rustls with a bundled root store (webpki-roots), not the
# OS's CA trust store -- Supabase's connection pooler presents a cert chain
# that native-tls/OpenSSL rejected as untrusted inside a minimal container,
# even with ca-certificates installed. Bundling roots sidesteps that
# category of problem entirely. reqwest keeps its own native-tls backend
# below, unrelated to this -- only the direct Postgres connection changes.
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
rusty-s3 = "0.10"
rand = "0.8"
url = "2.5.8"

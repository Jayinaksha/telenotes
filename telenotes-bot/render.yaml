services:
  - type: web
    name: telenotes-bot
    runtime: docker
    plan: free
    # Built from the repo root, not telenotes-bot/ -- the bot depends on
    # ../telenotes-core via a path dependency, so Docker's build context has
    # to see the whole workspace.
    dockerfilePath: telenotes-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      # Set after the first deploy, once Render has assigned the URL.
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ALLOWED_CHAT_IDS
        sync: false
      # Your GitHub Pages URL, no path, no trailing slash -- see SETUP.md
      # step 7. The /api/* write endpoints only answer CORS preflights from
      # this origin.
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      # Optional: all four, or leave them unset to store files in GitHub.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional: both, or neither.
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

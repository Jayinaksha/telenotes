services:
  - type: web
    name: telenotes-bot
    runtime: docker
    plan: free
    rootDir: telenotes-bot
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      # Set after the first deploy, once Render has assigned the URL.
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      # Optional: all four, or leave them unset to store files in GitHub.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Optional: both, or neither.
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

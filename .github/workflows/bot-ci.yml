name: bot-ci

# Path-filtered on purpose: this repo is private, so Actions minutes are
# metered and a Rust build is not cheap. Nothing here runs unless the
# workspace (bot, shared core, or TUI) changed.

on:
  push:
    paths:
      - "telenotes-bot/**"
      - "telenotes-core/**"
      - "telenotes-tui/**"
      - "Cargo.toml"
      - ".github/workflows/bot-ci.yml"
  pull_request:
    paths:
      - "telenotes-bot/**"
      - "telenotes-core/**"
      - "telenotes-tui/**"
      - "Cargo.toml"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

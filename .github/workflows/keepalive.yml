name: keepalive

# Stops the Supabase project auto-pausing after 7 days with no database
# activity. /health runs a real query, so one ping a day is enough.
#
# Deliberately NOT every 10 minutes. This repo is private, so Actions minutes
# are metered and every job is rounded up to a full minute: a */10 schedule is
# ~4,320 minutes/month, well past the 3,000 that GitHub Pro (and Education)
# includes. Daily is ~30 minutes/month.
#
# Keeping the free Render instance warm is a separate problem -- it sleeps
# after 15 minutes idle, so it needs a ping more often than Actions can
# affordably provide. Use an external free cron for that (see SETUP.md,
# "Keeping things awake"), or just accept a ~50s cold start on the first
# message after a quiet spell.

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour to dodge scheduler congestion
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::HEALTHCHECK_URL secret is not set; nothing to ping."
            exit 0
          fi
          # A sleeping free instance can take ~60s to answer the first request,
          # so allow generous timeouts and a couple of retries.
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors "$URL"
          echo "ok"
